openapi: 3.0.3
info:
  title: FundiLink API
  description: Job listings and service-application endpoints consumed by SettleIn.
  version: 1.1.0
servers:
  - url: http://localhost:3001
paths:
  /api/jobs:
    get:
      summary: List active job listings, optionally filtered by county and category
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [active, pending, completed, cancelled], default: active }
          example: active
        - name: county
          in: query
          required: false
          schema: { type: string }
          example: Nairobi
        - name: category
          in: query
          required: false
          schema: { type: string }
          example: plumbing
      responses:
        '200':
          description: Matching listings; empty array when none match
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Job' }
  /api/jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      summary: Return full details for one job
      responses:
        '200':
          description: Job found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/jobs/{jobId}/status:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      summary: Return lightweight job availability status
      responses:
        '200':
          description: Current status
          content:
            application/json:
              schema:
                type: object
                required: [jobId, status, updatedAt]
                properties:
                  jobId: { type: string, example: '1' }
                  status: { type: string, enum: [active, pending, completed, cancelled], example: active }
                  updatedAt: { type: string, format: date-time, example: '2026-10-13T08:30:00.000Z' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/applications:
    post:
      summary: Create a pending application for an active job
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationInput' }
            example: { jobId: '1', workerId: 'worker-42', workerName: 'Amina Otieno', note: 'Available tomorrow' }
      responses:
        '201':
          description: Application created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Job is unavailable or worker already applied }
  /api/applications/{applicationId}:
    parameters:
      - name: applicationId
        in: path
        required: true
        schema: { type: string }
        example: app-123
    put:
      summary: Update an existing pending application
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationInput' }
      responses:
        '200':
          description: Application updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Only pending applications may be updated }
    delete:
      summary: Cancel a pending application
      responses:
        '204': { description: Application cancelled; response has no body }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Only pending applications may be cancelled }
  /api/applications/{applicationId}/status:
    get:
      summary: Return current application status
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
          example: app-123
      responses:
        '200':
          description: Current status
          content:
            application/json:
              schema:
                type: object
                required: [applicationId, status, updatedAt]
                properties:
                  applicationId: { type: string, example: app-123 }
                  status: { type: string, enum: [pending, accepted, filled, cancelled], example: pending }
                  updatedAt: { type: string, format: date-time, example: '2026-10-13T09:15:00.000Z' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/applications/{applicationId}/subscribe:
    get:
      summary: Receive a server-sent event with the latest application status snapshot
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
          example: app-123
      responses:
        '200':
          description: SSE response containing an initial status event
          content:
            text/event-stream:
              schema: { type: string, example: "event: status\ndata: {applicationId: app-123, status: pending, updatedAt: 2026-10-13T09:15:00.000Z}\n\n" }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string }
      example: '1'
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: 'workerName is required' }
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: 'Job not found' }
  schemas:
    Job:
      type: object
      required: [id, title, category, location, pay, payType, duration]
      properties:
        id: { type: string, example: '1' }
        title: { type: string, example: Fix leaking kitchen sink }
        category: { type: string, example: plumbing }
        location: { type: string, example: 'Westlands, Nairobi' }
        pay: { type: number, minimum: 0, example: 1500 }
        payType: { type: string, example: fixed }
        duration: { type: string, example: '~2 hours' }
        urgent: { type: boolean, example: true }
        employerId: { oneOf: [{ type: string }, { type: integer }], example: '2' }
        employer: { type: string, example: 'Peter Mwangi' }
        description: { type: string, example: 'Repair a leaking tap' }
        isActive: { type: boolean, example: true }
        status: { type: string, enum: [active, pending, completed, cancelled], example: active }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ApplicationInput:
      type: object
      required: [jobId, workerId, workerName]
      properties:
        jobId: { type: string, example: '1' }
        workerId: { type: string, example: worker-42 }
        workerName: { type: string, minLength: 1, example: 'Amina Otieno' }
        scheduledAt: { type: string, format: date-time, example: '2026-10-25T09:00:00.000Z' }
        note: { type: string, example: 'Available tomorrow' }
    Application:
      allOf:
        - $ref: '#/components/schemas/ApplicationInput'
        - type: object
          required: [id, status, appliedAt, updatedAt]
          properties:
            id: { type: string, example: app-123 }
            status: { type: string, enum: [pending, accepted, filled, cancelled], example: pending }
            appliedAt: { type: string, format: date-time, example: '2026-10-13T09:15:00.000Z' }
            updatedAt: { type: string, format: date-time, example: '2026-10-13T09:15:00.000Z' }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string, example: 'Application not found' }
